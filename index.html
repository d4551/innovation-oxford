<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Oxford Messenger — a 1999 desktop, rebuilt</title>
    <meta name="description" content="A playable recreation of a 1999 desktop: AOL-style instant messenger, mail, Paint, a media player, an MS-DOS prompt and real DOS games — all in the browser.">
    <meta name="theme-color" content="#008080">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="canonical" href="./">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Oxford Messenger — a 1999 desktop, rebuilt">
    <meta property="og:description" content="Sign in over dial-up, chat with your buddy list, check your mail, and boot a DOS game. No plugins, no CDN, no tracking.">
    <meta property="og:image" content="media/oxford-page.png">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Vendored locally: no third-party requests, works offline. See vendor/VERSIONS.md -->
    <link rel="stylesheet" href="main.css">

    <!-- Every module is deferred: parsing is never blocked, and execution order
         is preserved, so main.js still runs last. -->
    <script src="vendor/howler/howler.core.min.js" defer></script>
    <!-- xterm (~480KB) and the DOS runtime (~3.9MB) are loaded on first use,
         not on every page load. See TerminalManager.loadEngine(). -->

    <script src="js/utils.js" defer></script>
    <script src="js/buddies.js" defer></script>
    <script src="js/clipart.js" defer></script>
    <script src="js/slides-data.js" defer></script>
    <script src="js/audio-manager.js" defer></script>
    <script src="js/window-manager.js" defer></script>
    <script src="js/app-window.js" defer></script>
    <script src="js/taskbar-manager.js" defer></script>
    <script src="js/chat-manager.js" defer></script>
    <script src="js/mail-manager.js" defer></script>
    <script src="js/terminal-manager.js" defer></script>
    <script src="js/msdos-manager.js" defer></script>
    <script src="js/dialup-intro.js" defer></script>
    <script src="js/media-player-manager.js" defer></script>
    <script src="js/ie-manager.js" defer></script>
    <script src="js/paint-manager.js" defer></script>
    <script src="js/folder-manager.js" defer></script>
    <script src="js/channels-manager.js" defer></script>
    <script src="js/start-menu.js" defer></script>
    <script src="js/desktop-icons.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <!-- Decorative CRT layers; hidden from assistive tech and from anyone who
         has asked for reduced motion (see main.css). -->
    <div class="screen-overlay" aria-hidden="true"></div>
    <div class="scanline" aria-hidden="true"></div>

    <main class="desktop hidden" aria-hidden="true">
        <h1 class="visually-hidden">Oxford Messenger — a 1999 desktop</h1>
        <!-- Buddy List -->
        <section class="window buddy-list" aria-label="Buddy List">
            <div class="title-bar">
                <div class="title-bar-text">
                    <div class="title-bar-icon" aria-hidden="true"></div>
                    <span class="title-bar-label">Buddy List</span>
                </div>
                <div class="title-bar-controls">
                    <button type="button" class="title-bar-btn" data-action="min" aria-label="Minimize Buddy List" title="Minimize">_</button>
                    <button type="button" class="title-bar-btn" data-action="max" aria-label="Maximize Buddy List" title="Maximize">□</button>
                    <button type="button" class="title-bar-btn" data-action="close" aria-label="Close Buddy List" title="Close">X</button>
                </div>
            </div>
            <div class="window-body">
                <div class="aim-logo">
                    <div class="aim-logo-text">OXFORD</div>
                    <div class="aim-logo-sub">Instant Messenger</div>
                </div>
                <!-- Populated from js/buddies.js -->
                <div class="buddy-groups"></div>
            </div>
        </section>

        <!-- Chat Window -->
        <section class="window chat-window" aria-label="Instant Message">
            <div class="title-bar">
                <div class="title-bar-text">
                    <div class="title-bar-icon" aria-hidden="true"></div>
                    <span class="title-bar-label">Instant Message from <span id="chatWith">Sepinator</span></span>
                </div>
                <div class="title-bar-controls">
                    <button type="button" class="title-bar-btn" data-action="min" aria-label="Minimize chat" title="Minimize">_</button>
                    <button type="button" class="title-bar-btn" data-action="max" aria-label="Maximize chat" title="Maximize">□</button>
                    <button type="button" class="title-bar-btn" data-action="close" aria-label="Close chat" title="Close">X</button>
                </div>
            </div>
            <div class="window-body">
                <p class="chat-header">To: <strong id="chatToUser">Sepinator</strong></p>

                <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="Conversation" tabindex="0"></div>

                <form class="chat-input">
                    <label class="visually-hidden" for="messageInput">Message</label>
                    <input type="text" id="messageInput" placeholder="Type your message here..."
                           autocomplete="off" enterkeyhint="send" />
                    <button type="submit" class="btn-95">Send</button>
                </form>
            </div>
        </section>
    </main>

    <!-- Taskbar -->
    <footer class="taskbar" aria-label="Taskbar" aria-hidden="true">
        <button type="button" class="start-btn">
            <span class="windows-logo" aria-hidden="true"></span>
            Start
        </button>
        <button type="button" class="btn-95 taskbar-dos">MS-DOS</button>
        <div class="taskbar-windows" aria-label="Open windows"></div>
        <time class="time-display" id="timeDisplay">--:--</time>
    </footer>
</body>
</html>
